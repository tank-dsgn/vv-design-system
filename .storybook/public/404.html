<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found · VV Design System</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root { --shadow: rgb(76 29 149 / 0.35); --bg: #ffffff; --fg: #0a0a0a; --muted: #525252; --ring: #8b5cf6; }
  :root.dark { --shadow: rgb(139 92 246 / 0.5); --bg: #0a0a0a; --fg: #fafafa; --muted: #a3a3a3; --ring: #a78bfa; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; box-sizing: border-box; color: var(--fg); font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 24px; text-align: center; }
  svg { width: 200px; height: 124px; margin-bottom: 32px; overflow: visible; }
  .tier { filter: drop-shadow(0 4px 4px var(--shadow)); }
  .t1 { fill: #ddd6fe; --delay: 240ms; } .t2 { fill: #a78bfa; --delay: 120ms; } .t3 { fill: #6d28d9; --delay: 0ms; }
  .tier { animation: rise 480ms ease-out var(--delay) both, wave 3s ease-in-out calc(var(--delay) + 800ms) infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  @keyframes wave { 0%, 60%, 100% { transform: none; } 30% { transform: translateY(-6px); } }
  h1 { margin: 0 0 8px; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 24px; line-height: 32px; font-weight: 500; letter-spacing: -0.02em; }
  p { max-width: 440px; margin: 0 0 24px; color: var(--muted); }
  a { display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 8px; background: #6d28d9; color: #ffffff; font-size: 14px; font-weight: 500; text-decoration: none; transition: background-color 150ms; }
  a:hover { background: #5b21b6; }
  a:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { a { transition: none; } .tier { animation: none; } }
</style>
<script>
  try { if (localStorage.getItem("vv-theme") === "dark") document.documentElement.classList.add("dark") } catch (e) {}
</script>
</head>
<body>
  <svg viewBox="0 0 200 124" aria-hidden="true"><polygon class="tier t3" points="34,88 166,88 193,124 7,124"/><polygon class="tier t2" points="67,44 133,44 160,80 40,80"/><polygon class="tier t1" points="100,0 127,36 73,36"/></svg>
  <h1>var(--this-page) is undefined</h1>
  <p>No token, no page. It may have moved or been renamed, or the address has a typo.</p>
  <a href="/">Back to the design system</a>
</body>
</html>
