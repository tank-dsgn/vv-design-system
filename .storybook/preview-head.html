<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Our own screen for every failure, over Storybook's. It may show before any bundle
     has loaded, so tokens.css cannot be assumed: the colours mirror the tokens here. */
  :root { --vve-bg: #ffffff; --vve-fg: #0a0a0a; --vve-muted: #525252; --vve-line: #e5e5e5; --vve-fill: #f5f5f5; --vve-brand: #6d28d9; --vve-brand-hover: #5b21b6; --vve-on-brand: #ffffff; --vve-ring: #8b5cf6; --vve-ghost: #a78bfa; }
  html.dark { --vve-bg: #0a0a0a; --vve-fg: #fafafa; --vve-muted: #a3a3a3; --vve-line: #262626; --vve-fill: #171717; --vve-brand: #6d28d9; --vve-brand-hover: #7c3aed; --vve-on-brand: #ffffff; --vve-ring: #a78bfa; --vve-ghost: #8b5cf6; background: #0a0a0a; }
  html.dark .sb-preparing-docs, html.dark .sb-preparing-story { background: #0a0a0a; }
  .sb-errordisplay, .sb-nopreview { position: fixed; inset: 0; z-index: 1000; padding: 0 !important; background: var(--vve-bg) !important; }
  .sb-errordisplay > *:not(#vv-error), .sb-nopreview > *:not(#vv-error) { display: none !important; }
  #vv-error { box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; padding: 32px 16px; background: var(--vve-bg); color: var(--vve-fg); font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 24px; text-align: center; }
  #vv-error .vve-art { width: 200px; height: 152px; margin-bottom: 32px; overflow: visible; }
  .vve-t1 { fill: #ddd6fe; } .vve-t2 { fill: #a78bfa; } .vve-t3 { fill: #6d28d9; }
  .vve-ghost { fill: none; stroke: var(--vve-ghost); stroke-width: 1.5; stroke-dasharray: 4 4; stroke-linejoin: round; }
  .vve-link { fill: none; stroke: var(--vve-ghost); stroke-width: 1.5; stroke-dasharray: 2 3; }
  .vve-float { animation: vve-float 3.2s ease-in-out infinite; }
  .vve-fade { animation: vve-fade 3.2s ease-in-out infinite; }
  @keyframes vve-float { 50% { transform: translateY(-6px); } }
  @keyframes vve-fade { 50% { opacity: 0.55; } }
  #vv-error h1.vve-code { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-weight: 500; letter-spacing: -0.02em; }
  #vv-error h1 { margin: 0 0 8px; color: var(--vve-fg); font-size: 24px; line-height: 32px; font-weight: 600; }
  #vv-error p { max-width: 440px; margin: 0 0 24px; color: var(--vve-muted); }
  #vv-error .vve-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  #vv-error a, #vv-error button.vve-btn { display: inline-flex; align-items: center; height: 40px; padding: 0 16px; box-sizing: border-box; border: 1px solid var(--vve-line); border-radius: 8px; background: none; color: var(--vve-fg); font: inherit; font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer; transition: background-color 150ms, border-color 150ms; }
  #vv-error a:hover, #vv-error button.vve-btn:hover { background: var(--vve-fill); }
  #vv-error button.vve-btn--primary, #vv-error a.vve-btn--primary { border-color: var(--vve-brand); background: var(--vve-brand); color: var(--vve-on-brand); }
  #vv-error button.vve-btn--primary:hover, #vv-error a.vve-btn--primary:hover { border-color: var(--vve-brand-hover); background: var(--vve-brand-hover); }
  #vv-error a:focus-visible, #vv-error button:focus-visible, #vv-error summary:focus-visible { outline: 2px solid var(--vve-ring); outline-offset: 2px; }
  #vv-error details { width: 100%; max-width: 640px; margin-top: 32px; color: var(--vve-muted); font-size: 14px; line-height: 20px; }
  #vv-error summary { display: inline-block; border-radius: 4px; cursor: pointer; }
  #vv-error pre { max-height: 240px; margin: 12px 0 0; padding: 12px; overflow: auto; border-radius: 8px; background: var(--vve-fill); color: var(--vve-fg); font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 12px; line-height: 16px; text-align: left; white-space: pre-wrap; word-break: break-word; }
  @media (prefers-reduced-motion: reduce) { #vv-error a, #vv-error button.vve-btn { transition: none; } .vve-float, .vve-fade { animation: none; } }
</style>
<script>
  (function () {
    // The saved theme, before anything renders, so no failure ever flashes the wrong one.
    try {
      var saved = localStorage.getItem("vv-theme")
      if (saved) document.documentElement.classList.toggle("dark", saved === "dark")
    } catch (e) {}

    // The case study's token pyramid, broken a different way for each failure.
    var ART = {
      missing: '<polygon class="vve-ghost vve-float" points="100,10 130,50 70,50"/><polygon class="vve-t2" points="64,58 136,58 161.5,92 38.5,92"/><polygon class="vve-t3" points="32.5,100 167.5,100 197.5,140 2.5,140"/>',
      offline: '<path class="vve-link" d="M100 54V62M100 96V104"/><polygon class="vve-t1 vve-float" points="100,0 130,40 70,40"/><polygon class="vve-t2 vve-fade" points="64,62 136,62 161.5,96 38.5,96"/><polygon class="vve-t3" points="32.5,110 167.5,110 197.5,150 2.5,150"/>',
      broken: '<polygon class="vve-t1 vve-float" points="168,62 198,102 138,102" transform="rotate(14 168 82)"/><polygon class="vve-t2" points="50,50 122,50 147.5,84 24.5,84" transform="rotate(-7 86 67)"/><polygon class="vve-t3" points="32.5,100 167.5,100 197.5,140 2.5,140"/>',
      empty: '<polygon class="vve-ghost" points="100,10 130,50 70,50"/><polygon class="vve-ghost" points="64,58 136,58 161.5,92 38.5,92"/><polygon class="vve-ghost" points="32.5,100 167.5,100 197.5,140 2.5,140"/>',
    }
    var HOME = "./?path=/docs/foundations-tokens--docs"

    function describe(message, empty) {
      if (empty) return { art: "empty", title: "Zero spacing, zero content", text: "The structure is here, nothing has filled it yet. Pick another page from the menu.", home: true }
      if (!navigator.onLine) return { art: "offline", title: "You've gone off the grid", text: "No connection, so nothing can resolve to a value. It all clicks back into place once you're online.", reload: true }
      if (/failed to fetch|networkerror|load failed|importing a module|dynamically imported|chunk/i.test(message))
        return { art: "offline", title: "The tokens didn't arrive", text: "The connection dropped on the way, or the site has just been updated. A reload usually reconnects everything.", reload: true, home: true, details: true }
      if (/couldn.t find|can.t find|unable to find|no story|not found/i.test(message))
        return { art: "missing", code: true, title: "var(--this-page) is undefined", text: "No token, no page. It may have moved or been renamed, or the address has a typo.", home: true, primaryHome: true }
      return { art: "broken", title: "This example fell out of the system", text: "Something in it broke. The rest of the pyramid is still standing.", reload: true, home: true, details: true }
    }

    function draw(wrapper, empty) {
      var msg = document.getElementById("error-message")
      var stack = document.getElementById("error-stack")
      var message = (msg && msg.textContent) || ""
      var key = (empty ? "empty" : message) + navigator.onLine
      var box = wrapper.querySelector("#vv-error")
      if (box && box.dataset.key === key) return
      if (!box) { box = document.createElement("div"); box.id = "vv-error"; box.setAttribute("role", "alert"); wrapper.appendChild(box) }
      box.dataset.key = key
      var d = describe(message, empty)
      box.innerHTML =
        '<svg class="vve-art" viewBox="0 0 200 152" aria-hidden="true">' + ART[d.art] + "</svg>" +
        "<h1></h1><p></p><div class=\"vve-actions\"></div>"
      if (d.code) box.querySelector("h1").className = "vve-code"
      box.querySelector("h1").textContent = d.title
      box.querySelector("p").textContent = d.text
      var actions = box.querySelector(".vve-actions")
      if (d.reload) {
        var b = document.createElement("button")
        b.type = "button"; b.className = "vve-btn vve-btn--primary"; b.textContent = "Reload page"
        b.onclick = function () { window.top.location.reload() }
        actions.appendChild(b)
      }
      if (d.home) {
        var a = document.createElement("a")
        a.href = HOME; a.target = "_top"; a.textContent = "Back to Tokens"
        if (d.primaryHome) a.className = "vve-btn--primary"
        actions.appendChild(a)
      }
      if (d.details && (message || (stack && stack.textContent))) {
        var det = document.createElement("details")
        det.innerHTML = "<summary>Technical details</summary><pre></pre>"
        det.querySelector("pre").textContent = message + (stack && stack.textContent ? "\n\n" + stack.textContent : "")
        box.appendChild(det)
      }
    }

    function check() {
      var body = document.body
      if (!body) return
      var err = document.querySelector(".sb-errordisplay")
      var none = document.querySelector(".sb-nopreview")
      if (err && body.classList.contains("sb-show-errordisplay")) draw(err, false)
      if (none && body.classList.contains("sb-show-nopreview")) draw(none, true)
    }

    function start() {
      new MutationObserver(check).observe(document.body, { attributes: true, attributeFilter: ["class"], childList: true, subtree: true, characterData: true })
      window.addEventListener("online", check)
      window.addEventListener("offline", check)
      check()
    }
    if (document.body) start()
    else document.addEventListener("DOMContentLoaded", start)
  })()
</script>
